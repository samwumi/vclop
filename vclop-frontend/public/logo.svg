<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Gradient Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.05" />
    </linearGradient>
    <!-- Premium Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with Premium Gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- Accent Overlay for Depth -->
  <circle cx="100" cy="100" r="95" fill="url(#accentGradient)"/>
  
  <!-- Premium V-shaped Arch Icon with Shadow -->
  <g filter="url(#shadow)">
    <!-- Upper Triangle (Stylized V representing Vertical) -->
    <path d="M 100 55 L 135 90 L 100 90 L 65 90 Z" 
          fill="url(#iconGradient)" 
          stroke="white" 
          stroke-width="2" 
          stroke-linejoin="round"
          opacity="0.98"/>
    
    <!-- Lower Arch (Capital Foundation symbolizing Strength) -->
    <path d="M 50 100 Q 100 87.5 150 100" 
          stroke="url(#iconGradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none"
          opacity="0.98"/>
    
    <!-- Supporting Pillars (Banking Stability) -->
    <line x1="60" y1="100" x2="60" y2="140" 
          stroke="url(#iconGradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.9"/>
    <line x1="100" y1="90" x2="100" y2="140" 
          stroke="url(#iconGradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.9"/>
    <line x1="140" y1="100" x2="140" y2="140" 
          stroke="url(#iconGradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.9"/>
    
    <!-- Strong Base Line (Foundation) -->
    <line x1="50" y1="145" x2="150" y2="145" 
          stroke="url(#iconGradient)" 
          stroke-width="7" 
          stroke-linecap="round"
          opacity="0.95"/>
  </g>
  
  <!-- Subtle Outer Ring for Premium Feel -->
  <circle cx="100" cy="100" r="94" 
          fill="none" 
          stroke="white" 
          stroke-width="1.5" 
          opacity="0.15"/>
  
  <!-- Inner Glow Ring -->
  <circle cx="100" cy="100" r="90" 
          fill="none" 
          stroke="white" 
          stroke-width="1" 
          opacity="0.1"/>
</svg>
