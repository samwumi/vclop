version: '3.9'

# =============================================================================
# VCLOP — Docker Compose
# Services: database (MariaDB), backend (NestJS), frontend (nginx)
# Usage:
#   docker compose up -d               # start all
#   docker compose logs -f backend     # tail backend logs
#   docker compose down -v             # stop and remove volumes
# =============================================================================

services:

  # ── MariaDB ────────────────────────────────────────────────────────────────
  database:
    image: mariadb:11.3
    container_name: vclop_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${DB_NAME:-vclop}
      MYSQL_USER:          ${DB_USER:-vclop}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-vclop_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vclop_net

  # ── NestJS Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./vclop-backend
      dockerfile: Dockerfile
    container_name: vclop_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV:                       production
      PORT:                           3000
      DATABASE_URL:                   mysql://${DB_USER:-vclop}:${DB_PASSWORD:-vclop_password}@database:3306/${DB_NAME:-vclop}
      JWT_SECRET:                     ${JWT_SECRET}
      JWT_EXPIRES_IN:                 ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET:           ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN:       ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      REFRESH_TOKEN_EXPIRES_DAYS:     ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      BCRYPT_ROUNDS:                  ${BCRYPT_ROUNDS:-12}
      FRONTEND_URL:                   ${FRONTEND_URL:-http://localhost}
      API_URL:                        ${API_URL:-http://localhost/api}
      SEED_ADMIN_PASSWORD:            ${SEED_ADMIN_PASSWORD}
      STORAGE_DRIVER:                 ${STORAGE_DRIVER:-local}
      UPLOAD_DIR:                     /app/uploads
      STORAGE_PUBLIC_URL:             ${STORAGE_PUBLIC_URL:-http://localhost/uploads}
      MAX_FILE_SIZE_MB:               ${MAX_FILE_SIZE_MB:-10}
      MAIL_HOST:                      ${MAIL_HOST}
      MAIL_PORT:                      ${MAIL_PORT:-587}
      MAIL_SECURE:                    ${MAIL_SECURE:-false}
      MAIL_USER:                      ${MAIL_USER}
      MAIL_PASSWORD:                  ${MAIL_PASSWORD}
      MAIL_FROM_NAME:                 ${MAIL_FROM_NAME:-VCLOP}
      MAIL_FROM_EMAIL:                ${MAIL_FROM_EMAIL}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - vclop_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./vclop-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: vclop_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - vclop_net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  db_data:
  uploads:
  logs:

# ── Network ────────────────────────────────────────────────────────────────
networks:
  vclop_net:
    driver: bridge
